
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21ER VIP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0b08;color:white;font-family:Arial;text-align:center;padding:18px}
h1,h2,.gold{color:#ffd36a}
.card{background:#201a12;border:1px solid #80612a;border-radius:16px;padding:18px;margin:14px 0}
.balance{font-size:32px;color:#ffd36a;font-weight:bold}
button{background:linear-gradient(#ffe39a,#b88322);border:0;border-radius:12px;padding:13px;margin:5px;color:#171008;font-weight:bold;cursor:pointer}
.pack{width:44%;min-height:90px}
small{color:#c6b99f}
</style>
</head>
<body>
<h1>👑 21ER COIN</h1>
<p>VIP GOLD EDITION</p>
<div class="card">
<h2>🪙 Mein Kontostand</h2>
<div class="balance" id="balance">0</div>
<small>21ER Testpunkte</small>
<p id="rate">0 Punkte pro Minute</p>
</div>
<div class="card">
<h2>👑 VIP SHOP</h2>
<p>Alle Pakete sind kostenlos testbar.</p>
<div id="packages"></div>
</div>
<div class="card">
<h2>⭐ Mein VIP-Status</h2>
<p id="status">Kein VIP aktiv</p>
<button onclick="resetVIP()">VIP-Test zurücksetzen</button>
</div>
<div class="card">
<h2>💰 Wallet</h2>
<p>Nur virtuelle Testpunkte.</p>
<button onclick="alert('Echtgeld-Auszahlungen sind noch nicht aktiviert.')">Auszahlung testen</button>
</div>
<small>21ER Demo – kein Echtgeldwert und keine echten Käufe.</small>
<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const plans=[
["Bronze","0,99",1],
["Silber","4,99",5],
["Gold","9,99",10],
["Platin","19,99",20],
["Diamant","29,99",30],
["Elite","49,99",50],
["Master","99,99",100],
["Royal","199,99",200],
["Legend","299,99",300],
["Imperial","499,99",500]
];

const key="21er_vip_demo_v1";
let data;
try {
 data=JSON.parse(localStorage.getItem(key))||{};
} catch(e){data={};}
if(!Number.isFinite(data.points))data.points=0;
if(!Number.isFinite(data.last))data.last=Date.now();

function save(){
 localStorage.setItem(key,JSON.stringify(data));
}
function update(){
 const now=Date.now();
 if(data.expires && now>=data.expires){
   const end=data.expires;
   const mins=Math.max(0,Math.floor((end-data.last)/60000));
   data.points+=mins*(data.rate||0);
   data.rate=0;
   data.name="";
   data.expires=0;
   data.last=now;
 } else {
   const mins=Math.max(0,Math.floor((now-data.last)/60000));
   data.points+=mins*(data.rate||0);
   data.last+=mins*60000;
 }
 document.getElementById("balance").textContent=
 Math.floor(data.points).toLocaleString("de-DE");
 document.getElementById("rate").textContent=
 (data.rate||0)+" Punkte pro Minute";
 document.getElementById("status").textContent=data.rate?
 data.name+" VIP – bis "+new Date(data.expires).toLocaleDateString("de-DE"):
 "Kein VIP aktiv";
 save();
}
function activate(i){
 update();
 const p=plans[i];
 if(!confirm(p[0]+" VIP kostenlos 30 Tage testen?"))return;
 data.name=p[0];
 data.rate=p[2];
 data.expires=Date.now()+30*24*60*60*1000;
 data.last=Date.now();
 update();
 alert(p[0]+" VIP aktiviert!");
}
function resetVIP(){
 if(!confirm("VIP-Test und Punkte zurücksetzen?"))return;
 data={points:0,last:Date.now(),rate:0,name:"",expires:0};
 update();
}
document.getElementById("packages").innerHTML=
plans.map((p,i)=>
'<button class="pack" onclick="activate('+i+')">'+
'👑 '+p[0]+'<br>'+p[1]+' $<br>'+
p[2]+' Punkte/Min.<br><small>Gratis testen</small></button>'
).join("");
update();
setInterval(update,1000);
</script>
</body>
</html>
